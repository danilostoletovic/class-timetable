name: Build and Release Android APK and AAB

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-android:
    name: Build signed Android APK and AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Configure existing release signing
        shell: python
        run: |
          import re
          from pathlib import Path

          # Use the existing repository keystore and its documented credentials.
          credentials = Path('keystore/README.md').read_text(encoding='utf-8')

          def credential(label):
              match = re.search(r'\*\*' + re.escape(label) + r'\*\*: `([^`]+)`', credentials)
              if not match:
                  raise SystemExit(f'Missing signing credential: {label}')
              return match.group(1)

          keystore = Path('keystore/upload-keystore.jks').resolve()
          if not keystore.is_file():
              raise SystemExit('Release keystore is missing')

          def property_value(value):
              return value.replace('\\', '\\\\').replace('\n', '\\n').replace('\r', '\\r')

          properties = {
              'storeFile': keystore.as_posix(),
              'storePassword': credential('Store Password'),
              'keyAlias': credential('Key Alias'),
              'keyPassword': credential('Key Password'),
          }
          Path('android/key.properties').write_text(
              ''.join(f'{key}={property_value(value)}\n' for key, value in properties.items()),
              encoding='utf-8',
          )

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android APK
        run: flutter build apk --release

      - name: Build Android App Bundle
        run: flutter build appbundle --release

      - name: Prepare Android artifacts
        run: |
          mkdir -p release
          cp build/app/outputs/flutter-apk/app-release.apk release/class_timetable-android-release.apk
          cp build/app/outputs/bundle/release/app-release.aab release/class_timetable-android-release.aab

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release
          path: |
            release/class_timetable-android-release.apk
            release/class_timetable-android-release.aab
          if-no-files-found: error

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Release ${{ github.ref_name }}
          generate_release_notes: true
          draft: false
          prerelease: false
          fail_on_unmatched_files: true
          files: |
            release/class_timetable-android-release.apk
            release/class_timetable-android-release.aab

      - name: Clean up signing configuration
        if: always()
        run: rm -f android/key.properties
