<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 - Page Not Found | Class Timetable</title>
  <meta name="description" content="The requested timetable page or link could not be found.">
  <meta name="theme-color" content="#0F172A">
  <link rel="icon" type="image/png" id="dynamic-favicon" href="favicon.png">

  <!-- Google Fonts: Outfit & Inter -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-primary: #090D16;
      --bg-secondary: #0F172A;
      --card-bg: rgba(15, 23, 42, 0.78);
      --card-border: rgba(255, 255, 255, 0.08);
      --card-border-hover: rgba(99, 102, 241, 0.35);
      --text-main: #F8FAFC;
      --text-muted: #94A3B8;
      --text-subtle: #64748B;
      --primary: #6366F1;
      --primary-hover: #4F46E5;
      --primary-glow: rgba(99, 102, 241, 0.3);
      --accent: #8B5CF6;
      --accent-glow: rgba(139, 92, 246, 0.25);
      --danger: #EF4444;
      --danger-bg: rgba(239, 68, 68, 0.12);
      --font-heading: 'Outfit', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      --font-body: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background-color: var(--bg-primary);
      color: var(--text-main);
      font-family: var(--font-body);
      overflow-x: hidden;
      position: relative;
      padding: 24px 16px;
    }

    /* Ambient Background Glows */
    .ambient-glow {
      position: fixed;
      border-radius: 50%;
      filter: blur(120px);
      pointer-events: none;
      z-index: 0;
      opacity: 0.55;
    }

    .glow-1 {
      top: -10%;
      left: 15%;
      width: 450px;
      height: 450px;
      background: radial-gradient(circle, var(--primary) 0%, rgba(99, 102, 241, 0) 70%);
      animation: floatGlow 12s ease-in-out infinite alternate;
    }

    .glow-2 {
      bottom: -10%;
      right: 15%;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--accent) 0%, rgba(139, 92, 246, 0) 70%);
      animation: floatGlow 14s ease-in-out infinite alternate-reverse;
    }

    .glow-3 {
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 320px;
      height: 320px;
      background: radial-gradient(circle, rgba(59, 130, 246, 0.15) 0%, transparent 70%);
    }

    @keyframes floatGlow {
      0% { transform: translateY(0) scale(1); }
      100% { transform: translateY(30px) scale(1.1); }
    }

    /* Main Container Card */
    .card-container {
      position: relative;
      z-index: 10;
      max-width: 580px;
      width: 100%;
      background: var(--card-bg);
      backdrop-filter: blur(24px);
      -webkit-backdrop-filter: blur(24px);
      border: 1px solid var(--card-border);
      border-radius: 24px;
      padding: 44px 36px;
      text-align: center;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5), 0 0 0 1px rgba(255, 255, 255, 0.05);
      transition: border-color 0.3s ease, box-shadow 0.3s ease;
    }

    .card-container:hover {
      border-color: var(--card-border-hover);
      box-shadow: 0 30px 60px -15px rgba(0, 0, 0, 0.6), 0 0 35px var(--primary-glow);
    }

    /* Animated Graphic / Illustration */
    .icon-wrapper {
      position: relative;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 110px;
      height: 110px;
      margin-bottom: 24px;
    }

    .icon-backdrop {
      position: absolute;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(99, 102, 241, 0.2), rgba(139, 92, 246, 0.2));
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 28px;
      transform: rotate(-6deg);
      transition: transform 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }

    .icon-wrapper:hover .icon-backdrop {
      transform: rotate(0deg) scale(1.05);
    }

    .icon-front {
      position: relative;
      width: 100%;
      height: 100%;
      background: linear-gradient(135deg, rgba(30, 41, 59, 0.9), rgba(15, 23, 42, 0.95));
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 28px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.3);
      animation: gentleFloat 4s ease-in-out infinite;
    }

    @keyframes gentleFloat {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-6px); }
    }

    .icon-front svg {
      width: 52px;
      height: 52px;
      stroke: var(--text-main);
      filter: drop-shadow(0 2px 8px var(--primary-glow));
    }

    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 14px;
      border-radius: 100px;
      background: var(--danger-bg);
      border: 1px solid rgba(239, 68, 68, 0.25);
      color: #FCA5A5;
      font-size: 13px;
      font-weight: 600;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      margin-bottom: 16px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--danger);
      box-shadow: 0 0 10px var(--danger);
      animation: blink 2s infinite ease-in-out;
    }

    @keyframes blink {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.4; transform: scale(0.85); }
    }

    h1 {
      font-family: var(--font-heading);
      font-size: 38px;
      font-weight: 800;
      line-height: 1.15;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #FFFFFF 30%, #CBD5E1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p.subtitle {
      font-size: 16px;
      line-height: 1.6;
      color: var(--text-muted);
      margin-bottom: 24px;
    }

    /* Diagnostics Path Box */
    .diagnostic-box {
      background: rgba(2, 6, 23, 0.6);
      border: 1px solid rgba(255, 255, 255, 0.06);
      border-radius: 14px;
      padding: 12px 16px;
      margin-bottom: 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
    }

    .diagnostic-path {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 13px;
      color: #E2E8F0;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      max-width: 380px;
    }

    .copy-btn {
      background: transparent;
      border: none;
      color: var(--text-subtle);
      cursor: pointer;
      padding: 6px;
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s ease;
      flex-shrink: 0;
    }

    .copy-btn:hover {
      background: rgba(255, 255, 255, 0.1);
      color: var(--text-main);
    }

    .copy-btn svg {
      width: 16px;
      height: 16px;
    }

    /* Redirect Progress Section */
    .redirect-banner {
      background: linear-gradient(90deg, rgba(99, 102, 241, 0.12), rgba(139, 92, 246, 0.12));
      border: 1px solid rgba(99, 102, 241, 0.2);
      border-radius: 12px;
      padding: 12px 16px;
      margin-bottom: 28px;
      position: relative;
      overflow: hidden;
    }

    .redirect-content {
      display: flex;
      align-items: center;
      justify-content: space-between;
      font-size: 14px;
      color: #E2E8F0;
      position: relative;
      z-index: 2;
    }

    .cancel-link {
      background: none;
      border: none;
      color: #A5B4FC;
      font-size: 13px;
      font-weight: 500;
      text-decoration: underline;
      cursor: pointer;
      padding: 2px 6px;
      border-radius: 4px;
      transition: color 0.2s ease;
    }

    .cancel-link:hover {
      color: #FFFFFF;
    }

    .progress-bar {
      position: absolute;
      bottom: 0;
      left: 0;
      height: 3px;
      width: 100%;
      background: linear-gradient(90deg, var(--primary), var(--accent));
      transform-origin: left;
      transition: width 1s linear;
    }

    /* Action Buttons */
    .button-group {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      justify-content: center;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      padding: 13px 24px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      font-family: var(--font-body);
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s cubic-bezier(0.4, 0, 0.2, 1);
      border: 1px solid transparent;
      outline: none;
    }

    .btn:active {
      transform: scale(0.98);
    }

    .btn-primary {
      background: linear-gradient(135deg, var(--primary) 0%, #4F46E5 100%);
      color: #FFFFFF;
      box-shadow: 0 4px 16px var(--primary-glow);
      flex: 1 1 200px;
    }

    .btn-primary:hover {
      background: linear-gradient(135deg, #4F46E5 0%, #4338CA 100%);
      box-shadow: 0 6px 20px rgba(99, 102, 241, 0.45);
      transform: translateY(-2px);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.05);
      border-color: rgba(255, 255, 255, 0.1);
      color: #E2E8F0;
      flex: 1 1 140px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
      border-color: rgba(255, 255, 255, 0.2);
      color: #FFFFFF;
      transform: translateY(-2px);
    }

    .btn svg {
      width: 18px;
      height: 18px;
      stroke: currentColor;
    }

    /* Footer Meta */
    .footer {
      margin-top: 32px;
      font-size: 13px;
      color: var(--text-subtle);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 16px;
    }

    .footer a {
      color: var(--text-muted);
      text-decoration: none;
      transition: color 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .footer a:hover {
      color: var(--text-main);
    }

    /* Toast Notification */
    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(100px);
      background: #1E293B;
      color: #F8FAFC;
      padding: 10px 20px;
      border-radius: 100px;
      font-size: 14px;
      border: 1px solid rgba(255, 255, 255, 0.1);
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 8px;
      z-index: 100;
      opacity: 0;
      pointer-events: none;
      transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }

    .toast.show {
      transform: translateX(-50%) translateY(0);
      opacity: 1;
    }

    @media (max-width: 480px) {
      .card-container {
        padding: 32px 20px;
      }
      h1 {
        font-size: 30px;
      }
      .btn {
        width: 100%;
      }
    }
  </style>
</head>
<body>

  <!-- Ambient Glow Effects -->
  <div class="ambient-glow glow-1"></div>
  <div class="ambient-glow glow-2"></div>
  <div class="ambient-glow glow-3"></div>

  <main class="card-container" role="main">
    <!-- Icon / Badge -->
    <div class="icon-wrapper">
      <div class="icon-backdrop"></div>
      <div class="icon-front">
        <!-- Calendar / Timetable with Question Mark -->
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="4" width="18" height="18" rx="3" ry="3"></rect>
          <line x1="16" y1="2" x2="16" y2="6"></line>
          <line x1="8" y1="2" x2="8" y2="6"></line>
          <line x1="3" y1="10" x2="21" y2="10"></line>
          <circle cx="12" cy="15" r="1.5" fill="currentColor"></circle>
          <path d="M12 12v-1a2 2 0 1 1 2-2"></path>
        </svg>
      </div>
    </div>

    <div>
      <div class="status-badge">
        <span class="status-dot"></span>
        <span>404 Not Found</span>
      </div>
    </div>

    <h1>Lost in the Schedule?</h1>
    <p class="subtitle">
      The timetable page or link you requested does not exist or may have been moved.
    </p>

    <!-- Path Box -->
    <div class="diagnostic-box" title="Requested Path">
      <span class="diagnostic-path" id="requested-path">Loading requested URL...</span>
      <button class="copy-btn" id="copy-btn" title="Copy URL" aria-label="Copy requested URL">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
          <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
        </svg>
      </button>
    </div>

    <!-- Countdown & Redirect Notification -->
    <div class="redirect-banner" id="redirect-banner">
      <div class="redirect-content">
        <span>Returning to Timetable in <strong id="countdown-sec">5</strong>s...</span>
        <button class="cancel-link" id="cancel-redirect-btn" type="button">Stay Here</button>
      </div>
      <div class="progress-bar" id="progress-bar"></div>
    </div>

    <!-- Actions -->
    <div class="button-group">
      <a href="#" class="btn btn-primary" id="home-link">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
          <polyline points="9 22 9 12 15 12 15 22"></polyline>
        </svg>
        <span>Open Class Timetable</span>
      </a>

      <button class="btn btn-secondary" id="reload-btn" type="button">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="23 4 23 10 17 10"></polyline>
          <polyline points="1 20 1 14 7 14"></polyline>
          <path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10M1 14l4.64 4.36A9 9 0 0 0 20.49 15"></path>
        </svg>
        <span>Reload</span>
      </button>
    </div>

    <div class="footer">
      <a href="https://github.com/danilostoletovic/class-timetable" target="_blank" rel="noopener noreferrer" id="github-repo-link">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M9 19c-5 1.5-5-2.5-7-3m14 6v-3.87a3.37 3.37 0 0 0-.94-2.61c3.14-.35 6.44-1.54 6.44-7A5.44 5.44 0 0 0 20 4.77 5.07 5.07 0 0 0 19.91 1S18.73.65 16 2.48a13.38 13.38 0 0 0-7 0C6.27.65 5.09 1 5.09 1A5.07 5.07 0 0 0 5 4.77a5.44 5.44 0 0 0-1.5 3.78c0 5.42 3.3 6.61 6.44 7A3.37 3.37 0 0 0 9 18.13V22"></path>
        </svg>
        <span>Repository</span>
      </a>
      <span>•</span>
      <span>Class Timetable App</span>
    </div>
  </main>

  <!-- Toast Notification -->
  <div class="toast" id="toast" role="alert" aria-live="polite">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#4ADE80" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
      <polyline points="20 6 9 17 4 12"></polyline>
    </svg>
    <span id="toast-text">URL copied to clipboard!</span>
  </div>

  <script>
    (function () {
      'use strict';

      // 1. Calculate Base Path dynamically for GitHub Pages, custom domain, or local preview
      function getBasePath() {
        const path = window.location.pathname;
        const hostname = window.location.hostname;

        // If on GitHub Pages (*.github.io), repo name is the first segment
        if (hostname.endsWith('github.io')) {
          const segments = path.split('/').filter(Boolean);
          if (segments.length > 0) {
            return '/' + segments[0] + '/';
          }
        }

        // Local or other hosting where path starts with /class-timetable/ or /class_timetable/
        const match = path.match(/^\/([^\/]+)/);
        if (match && (match[1].toLowerCase().includes('timetable') || match[1].toLowerCase().includes('class'))) {
          return '/' + match[1] + '/';
        }

        return '/';
      }

      const basePath = getBasePath();
      const homeUrl = window.location.origin + basePath;

      // Update favicon dynamically so relative depth doesn't break it
      const dynamicFavicon = document.getElementById('dynamic-favicon');
      if (dynamicFavicon) {
        dynamicFavicon.href = basePath + 'favicon.png';
      }

      // Display current requested broken path
      const pathEl = document.getElementById('requested-path');
      if (pathEl) {
        pathEl.textContent = window.location.pathname + window.location.search + window.location.hash;
        pathEl.title = window.location.href;
      }

      // Home Link
      const homeLink = document.getElementById('home-link');
      if (homeLink) {
        homeLink.href = homeUrl;
      }

      // Reload Button
      const reloadBtn = document.getElementById('reload-btn');
      if (reloadBtn) {
        reloadBtn.addEventListener('click', function () {
          window.location.reload();
        });
      }

      // Copy Button & Toast
      const copyBtn = document.getElementById('copy-btn');
      const toast = document.getElementById('toast');
      let toastTimeout;

      function showToast(message) {
        const toastText = document.getElementById('toast-text');
        if (toastText) toastText.textContent = message;
        toast.classList.add('show');
        clearTimeout(toastTimeout);
        toastTimeout = setTimeout(() => {
          toast.classList.remove('show');
        }, 3000);
      }

      if (copyBtn) {
        copyBtn.addEventListener('click', function () {
          navigator.clipboard.writeText(window.location.href)
            .then(() => showToast('Link copied to clipboard!'))
            .catch(() => {
              // Fallback
              const input = document.createElement('input');
              input.value = window.location.href;
              document.body.appendChild(input);
              input.select();
              document.execCommand('copy');
              document.body.removeChild(input);
              showToast('Link copied to clipboard!');
            });
        });
      }

      // Countdown & Auto Redirect
      let secondsLeft = 5;
      const totalSeconds = 5;
      const countdownEl = document.getElementById('countdown-sec');
      const progressBar = document.getElementById('progress-bar');
      const redirectBanner = document.getElementById('redirect-banner');
      const cancelBtn = document.getElementById('cancel-redirect-btn');
      let isCancelled = false;

      // Update progress bar
      function updateProgress() {
        if (progressBar) {
          const percent = (secondsLeft / totalSeconds) * 100;
          progressBar.style.width = percent + '%';
        }
      }

      const timerInterval = setInterval(function () {
        if (isCancelled) return;
        secondsLeft--;
        if (countdownEl) {
          countdownEl.textContent = secondsLeft;
        }
        updateProgress();

        if (secondsLeft <= 0) {
          clearInterval(timerInterval);
          window.location.replace(homeUrl);
        }
      }, 1000);

      // Cancel Auto-Redirect
      if (cancelBtn) {
        cancelBtn.addEventListener('click', function () {
          isCancelled = true;
          clearInterval(timerInterval);
          if (redirectBanner) {
            redirectBanner.innerHTML = '<div class="redirect-content" style="justify-content:center;"><span>Auto-redirect paused. Click below to return anytime.</span></div>';
          }
        });
      }
    })();
  </script>
</body>
</html>
